{{define "section"}}
<div class="space-y-6">
  <form data-ajax-form method="POST" action="/dashboard/sites/{{.Site.Slug}}/appearance" class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm space-y-8">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <section>
      <h3 class="font-semibold text-slate-900 mb-4">Colour palette</h3>
      <div class="grid sm:grid-cols-2 gap-4">
        {{range $i, $p := .Palettes}}
        <label class="flex items-center gap-3 rounded-2xl border border-slate-200 p-4 cursor-pointer transition hover:border-slate-300 has-[:checked]:border-brand has-[:checked]:ring-2 has-[:checked]:ring-brand/20">
          <input type="radio" name="palette" value="{{$p.ID}}" {{if or (eq $p.ID $.Site.Palette) (and (eq $.Site.Palette "") (eq $i 0))}}checked{{end}}>
          <span class="h-5 w-5 rounded-full border border-black/5" style="background:{{paletteColor $p.ID}}"></span>
          <span class="font-medium text-slate-900">{{$p.Name}}</span>
        </label>
        {{end}}
      </div>
    </section>
    <section>
      <h3 class="font-semibold text-slate-900 mb-2">Brand colour</h3>
      <p class="text-sm text-slate-500 mb-4">Optional — overrides the palette's accent colour with your exact brand hex.</p>
      <div class="flex items-center gap-3">
        <input type="color" value="{{if .Site.BrandColor}}{{.Site.BrandColor}}{{else}}#4338CA{{end}}"
               oninput="this.nextElementSibling.value = this.value"
               class="h-11 w-14 rounded-lg border border-slate-200 cursor-pointer">
        <input type="text" name="brand_color" value="{{.Site.BrandColor}}" placeholder="e.g. #4F46E5"
               pattern="^#?[0-9A-Fa-f]{6}$" maxlength="7"
               oninput="this.previousElementSibling.value = this.value.startsWith('#') ? this.value : '#' + this.value"
               class="flex-1 rounded-lg border border-slate-200 px-4 py-2.5">
      </div>
    </section>
    <section>
      <h3 class="font-semibold text-slate-900 mb-4">Heading font</h3>
      <select name="heading_font" class="w-full rounded-lg border border-slate-200 px-4 py-2.5">
        <option value="" {{if eq .Site.HeadingFont ""}}selected{{end}}>Design default</option>
        <option value="sans" {{if eq .Site.HeadingFont "sans"}}selected{{end}}>Sans-serif</option>
        <option value="serif" {{if eq .Site.HeadingFont "serif"}}selected{{end}}>Serif</option>
      </select>
    </section>
    <button type="submit" class="w-full rounded-full bg-brand px-6 py-3.5 font-semibold text-white hover:bg-brand-dark transition">Save appearance</button>
  </form>

  <form data-ajax-form method="POST" action="/dashboard/sites/{{.Site.Slug}}/switch-template" class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm space-y-6">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div>
      <h3 class="font-semibold text-slate-900">Switch design</h3>
      <p class="mt-1 text-sm text-slate-500">Your content carries over. Nothing is lost when you switch.</p>
    </div>
    <div class="grid sm:grid-cols-2 gap-4">
      {{range .Templates}}
      <label class="flex items-start gap-3 rounded-2xl border border-slate-200 p-5 cursor-pointer transition hover:border-slate-300 has-[:checked]:border-brand has-[:checked]:ring-2 has-[:checked]:ring-brand/20">
        <input type="radio" name="template_id" value="{{.ID}}" {{if eq .ID $.Site.TemplateID}}checked{{end}} class="mt-1">
        <span>
          <span class="block font-semibold text-slate-900">{{.Name}}</span>
          <span class="block text-sm text-slate-500 mt-1">{{.Description}}</span>
        </span>
      </label>
      {{end}}
    </div>
    <button type="submit" class="w-full rounded-full bg-brand px-6 py-3.5 font-semibold text-white hover:bg-brand-dark transition">Switch design</button>
  </form>
</div>
{{end}}
