{{define "section"}}
<form data-ajax-form method="POST" action="/dashboard/sites/{{.Site.Slug}}/form-type" class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm space-y-4">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <label class="flex items-start gap-3 rounded-2xl border border-slate-200 p-5 cursor-pointer transition hover:border-slate-300 has-[:checked]:border-brand has-[:checked]:ring-2 has-[:checked]:ring-brand/20">
    <input type="radio" name="form_type" value="contact" {{if eq .Site.FormType "contact"}}checked{{end}} class="mt-1">
    <span>
      <span class="block font-semibold text-slate-900">Contact form</span>
      <span class="block text-sm text-slate-500 mt-1">Name, email, phone and a free-text message — plus a service picker and preferred time if you've added services.</span>
    </span>
  </label>
  <label class="flex items-start gap-3 rounded-2xl border border-slate-200 p-5 cursor-pointer transition hover:border-slate-300 has-[:checked]:border-brand has-[:checked]:ring-2 has-[:checked]:ring-brand/20">
    <input type="radio" name="form_type" value="booking" {{if eq .Site.FormType "booking"}}checked{{end}} class="mt-1">
    <span>
      <span class="block font-semibold text-slate-900">Booking form</span>
      <span class="block text-sm text-slate-500 mt-1">Adds a service picker and preferred time, so requests arrive pre-qualified.</span>
    </span>
  </label>
  <label class="flex items-start gap-3 rounded-2xl border border-slate-200 p-5 cursor-pointer transition hover:border-slate-300 has-[:checked]:border-brand has-[:checked]:ring-2 has-[:checked]:ring-brand/20">
    <input type="radio" name="form_type" value="appointment" {{if eq .Site.FormType "appointment"}}checked{{end}} class="mt-1">
    <span>
      <span class="block font-semibold text-slate-900">Appointment request</span>
      <span class="block text-sm text-slate-500 mt-1">Adds a service picker, a specific preferred date and party size, for businesses booking a particular slot.</span>
    </span>
  </label>
  <button type="submit" class="w-full rounded-full bg-brand px-6 py-3.5 font-semibold text-white hover:bg-brand-dark transition">Save</button>
</form>
{{end}}
