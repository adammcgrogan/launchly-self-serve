{{/* Repeatable-row widgets for the content editor (services, FAQs, staff,
     certifications, areas, testimonials, gallery, hours, special hours).
     Split out of site_content.html purely to keep that file readable — it
     is only ever rendered from there. */}}
{{define "content_rows_js"}}
<script>
  (function () {
    var serviceList = document.querySelector('[data-service-list]');
    if (!serviceList) return;
    function updateServiceRemoveButtons() {
      var rows = serviceList.querySelectorAll('[data-service-row]');
      rows.forEach(function (row) {
        row.querySelector('[data-remove-service]').classList.toggle('hidden', rows.length <= 1);
      });
    }
    document.querySelector('[data-add-service]').addEventListener('click', function () {
      var rows = serviceList.querySelectorAll('[data-service-row]');
      var clone = rows[rows.length - 1].cloneNode(true);
      clone.querySelectorAll('input, textarea').forEach(function (el) { el.value = ''; });
      serviceList.appendChild(clone);
      updateServiceRemoveButtons();
    });
    serviceList.addEventListener('click', function (e) {
      if (e.target.matches('[data-remove-service]')) {
        e.target.closest('[data-service-row]').remove();
        updateServiceRemoveButtons();
      }
    });
    updateServiceRemoveButtons();
  })();

  (function () {
    var galleryList = document.querySelector('[data-gallery-list]');
    if (!galleryList) return;
    function updateGalleryRemoveButtons() {
      var rows = galleryList.querySelectorAll('[data-gallery-row]');
      rows.forEach(function (row) {
        row.querySelector('[data-remove-gallery]').classList.toggle('hidden', rows.length <= 1);
      });
    }
    function setThumb(row, url) {
      var thumb = row.querySelector('[data-gallery-thumb]');
      if (!thumb) return;
      if (thumb.tagName === 'IMG') {
        if (url) { thumb.src = url; return; }
        var placeholder = document.createElement('div');
        placeholder.className = 'h-12 w-12 shrink-0 rounded-lg bg-slate-100';
        placeholder.setAttribute('data-gallery-thumb', '');
        thumb.replaceWith(placeholder);
        return;
      }
      if (!url) return;
      var img = document.createElement('img');
      img.src = url;
      img.alt = '';
      img.className = 'h-12 w-12 shrink-0 rounded-lg object-cover border border-slate-200';
      img.setAttribute('data-gallery-thumb', '');
      thumb.replaceWith(img);
    }
    function addGalleryRow(url) {
      var rows = galleryList.querySelectorAll('[data-gallery-row]');
      var clone = rows[rows.length - 1].cloneNode(true);
      clone.querySelector('input[name="gallery_url"]').value = url || '';
      setThumb(clone, url || '');
      galleryList.appendChild(clone);
      updateGalleryRemoveButtons();
      return clone;
    }
    document.querySelector('[data-add-gallery]').addEventListener('click', function () {
      addGalleryRow('');
    });
    galleryList.addEventListener('click', function (e) {
      if (e.target.matches('[data-remove-gallery]')) {
        e.target.closest('[data-gallery-row]').remove();
        updateGalleryRemoveButtons();
      }
    });
    galleryList.addEventListener('input', function (e) {
      if (e.target.matches('input[name="gallery_url"]')) {
        setThumb(e.target.closest('[data-gallery-row]'), e.target.value.trim());
      }
    });
    updateGalleryRemoveButtons();
    window.__addGalleryRow = addGalleryRow;
  })();

  (function () {
    var hoursList = document.querySelector('[data-hours-list]');
    if (!hoursList) return;
    var rows = hoursList.querySelectorAll('[data-hours-row]');

    function setRowDisabled(row, closed) {
      row.querySelector('[data-hours-open]').disabled = closed;
      row.querySelector('[data-hours-close]').disabled = closed;
    }

    rows.forEach(function (row) {
      row.querySelector('[data-hours-closed]').addEventListener('change', function (e) {
        setRowDisabled(row, e.target.checked);
      });
    });

    var copyBtn = document.querySelector('[data-copy-hours]');
    if (copyBtn) {
      copyBtn.addEventListener('click', function () {
        var monday = rows[0];
        var open = monday.querySelector('[data-hours-open]').value;
        var close = monday.querySelector('[data-hours-close]').value;
        var closed = monday.querySelector('[data-hours-closed]').checked;
        rows.forEach(function (row) {
          if (row === monday) return;
          row.querySelector('[data-hours-open]').value = open;
          row.querySelector('[data-hours-close]').value = close;
          row.querySelector('[data-hours-closed]').checked = closed;
          setRowDisabled(row, closed);
        });
      });
    }
  })();
