{{define "content"}}
<div class="bg-white rounded-2xl border border-slate-200 p-8">
  <h1 class="font-display text-2xl font-bold text-slate-900">Create your account</h1>
  <p class="mt-2 text-sm text-slate-500">Free to start, no card required.</p>

  {{if .Error}}<p class="mt-4 rounded-lg bg-red-50 text-red-700 text-sm px-4 py-3">{{.Error}}</p>{{end}}

  <form method="POST" action="/signup" class="mt-6 space-y-4">
    {{if .Next}}<input type="hidden" name="next" value="{{.Next}}">{{end}}
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
      <input type="email" name="email" value="{{.Email}}" required class="w-full rounded-lg border border-slate-200 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
      <input type="password" name="password" id="password" required minlength="8" class="w-full rounded-lg border border-slate-200 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand">
      <div id="password-strength-bar" class="mt-2 h-1 rounded-full bg-slate-100 overflow-hidden hidden">
        <div id="password-strength-fill" class="h-full w-0 transition-all"></div>
      </div>
      <p class="mt-1 text-xs text-slate-400" id="password-strength-label">At least 8 characters.</p>
    </div>
    <button type="submit" class="w-full rounded-lg bg-brand px-6 py-3 font-semibold text-white hover:bg-brand-dark transition">Create account</button>
  </form>

  <p class="mt-6 text-center text-sm text-slate-500">Already have an account? <a href="/login" class="text-brand font-medium">Log in</a></p>
</div>
<script>
  // Advisory-only client-side strength hint (length + character-class
  // variety). The server-side common-password denylist is what actually
  // enforces anything.
  (function () {
    var input = document.getElementById('password');
    var bar = document.getElementById('password-strength-bar');
    var fill = document.getElementById('password-strength-fill');
    var label = document.getElementById('password-strength-label');

    function scorePassword(value) {
      if (!value) return 0;
      var score = 0;
      if (value.length >= 8) score++;
      if (value.length >= 12) score++;
      if (/[a-z]/.test(value)) score++;
      if (/[A-Z]/.test(value)) score++;
      if (/[0-9]/.test(value)) score++;
      if (/[^A-Za-z0-9]/.test(value)) score++;
      return score;
    }

    input.addEventListener('input', function () {
      var value = input.value;
      if (!value) {
        bar.classList.add('hidden');
        label.textContent = 'At least 8 characters.';
        return;
      }
      bar.classList.remove('hidden');
      var score = scorePassword(value);
      var strength, colorClass, widthPct;
      if (score <= 2) {
        strength = 'Weak'; colorClass = 'bg-red-500'; widthPct = '33%';
      } else if (score <= 4) {
        strength = 'Fair'; colorClass = 'bg-amber-500'; widthPct = '66%';
      } else {
        strength = 'Strong'; colorClass = 'bg-green-500'; widthPct = '100%';
      }
      fill.className = 'h-full transition-all ' + colorClass;
      fill.style.width = widthPct;
      label.textContent = strength + ' password. At least 8 characters.';
    });
  })();
</script>
{{end}}
