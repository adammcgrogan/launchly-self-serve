{{define "content"}}
<section class="max-w-3xl mx-auto px-6 pt-20 pb-24">
  <h1 class="font-display text-4xl sm:text-5xl font-bold text-slate-900">Blog</h1>
  <p class="mt-4 text-lg text-slate-600">Notes on building Launchly, and what actually matters for a local business website.</p>

  <div class="mt-16 divide-y divide-slate-100">
    {{range .Posts}}
    <article class="py-8">
      <p class="text-sm text-slate-400">{{.PublishedAt}}</p>
      <h2 class="mt-1 font-display text-2xl font-bold text-slate-900">
        <a href="/blog/{{.Slug}}" class="hover:text-brand">{{.Title}}</a>
      </h2>
      <p class="mt-2 text-slate-600">{{.Description}}</p>
      <a href="/blog/{{.Slug}}" class="mt-3 inline-block text-sm font-semibold text-brand hover:underline">Read more &rarr;</a>
    </article>
    {{end}}
  </div>
</section>
{{end}}
