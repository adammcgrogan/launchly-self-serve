{{define "content"}}

<section class="relative overflow-hidden">
  <div class="absolute inset-0 -z-10 bg-gradient-to-b from-indigo-100 via-violet-50 to-white pointer-events-none"></div>
  <div class="absolute -top-24 left-1/2 -translate-x-1/2 -z-10 w-[820px] h-[440px] bg-[radial-gradient(closest-side,rgba(129,140,248,0.45),transparent)] pointer-events-none"></div>

  <div class="relative max-w-lg mx-auto px-6 pt-32 pb-32 text-center">
    <p class="font-display text-2xl font-bold text-brand">{{.Slug}}.launchly.ltd</p>
    <h1 class="mt-4 font-display text-3xl sm:text-4xl font-bold text-slate-900">This address is available</h1>
    <p class="mt-3 text-slate-600">Put your business here in minutes. No approval, no waiting — sign up and go live instantly.</p>
    <a href="{{.SignupURL}}" class="mt-8 inline-flex items-center rounded-full bg-brand px-8 py-4 text-base font-semibold text-white hover:bg-brand-dark transition">Claim this address</a>
    <p class="mt-6 text-sm text-slate-500">7-day free trial &middot; from £9/mo &middot; cancel any time</p>
  </div>
</section>

{{end}}
