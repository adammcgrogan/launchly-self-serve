<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #4F46E5;
    --ink: #0f172a;
    --muted: #475569;
    --line: #e2e8f0;
  }
  html, body {
    margin: 0; padding: 0; width: 1080px; height: 1350px;
    background: #ffffff;
    font-family: 'Inter', -apple-system, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .blob {
    position: absolute; top: -220px; left: 50%; transform: translateX(-50%);
    width: 900px; height: 620px; border-radius: 50%;
    background: linear-gradient(135deg, #c7d2fe 0%, #ede9fe 55%, #fef3c7 100%);
    filter: blur(70px); opacity: 0.75;
  }
  .frame {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    box-sizing: border-box;
    padding: 88px 96px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px; width: fit-content;
    font-size: 24px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--brand); margin: 0 0 32px;
  }
  .eyebrow::before {
    content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--brand);
  }
  .headline {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 78px; line-height: 1.1; letter-spacing: -0.01em;
    color: var(--ink); margin: 0 0 32px; max-width: 860px;
  }
  .headline .hl { color: var(--brand); }
  .subtext {
    font-size: 30px; font-weight: 400; line-height: 1.55;
    color: var(--muted); margin: 0 0 44px; max-width: 760px;
  }
  .points {
    display: flex; flex-direction: column; gap: 18px;
  }
  .point {
    display: flex; align-items: flex-start; gap: 16px;
    font-size: 28px; color: var(--ink); font-weight: 500;
  }
  .point .dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--brand);
    margin-top: 12px; flex-shrink: 0;
  }
  .footer {
    position: absolute; left: 96px; bottom: 72px; z-index: 1;
    display: flex; align-items: center; gap: 14px;
  }
  .footer .mark {
    width: 34px; height: 34px; border-radius: 9px; background: var(--brand);
  }
  .footer .word {
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 30px; color: var(--ink);
  }
</style>
</head>
<body>
  <div class="blob"></div>
  <div class="frame">
    <p class="eyebrow">New here</p>
    <h1 class="headline">Live at <span class="hl">yourbusiness.launchly.ltd</span> today</h1>
    <p class="subtext">Pick a design, add your content, and your site publishes immediately — no approval queue, no waiting on a designer.</p>
    <div class="points"></div>
  </div>
  <div class="footer">
    <div class="mark"></div>
    <span class="word">launchly</span>
  </div>
</body>
</html>
